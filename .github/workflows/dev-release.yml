name: Dev release

# On-demand PRE-RELEASE publish from `develop` — a dev build to exercise a candidate
# before the real release. Manually triggered (workflow_dispatch; run it with
# `--ref develop`, or via `git dev-release`). Publishes the `X.Y.Z.devN` version to
# TestPyPI. It creates NO `v*` tag, so the real release.yml gate is untouched, and runs
# no changelog job. See the handbook's releases.md ("Development versioning") + ci.md.
#
# cogrind-workshop is a pure CLI client — TestPyPI only, no GHCR/Docker image (its
# release.yml has no docker job either).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write       # TestPyPI trusted publishing (OIDC)

jobs:
  # Gate: dev builds come from develop and must carry a dev version.
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify dev build from develop
        id: v
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "dev-release runs from develop only (got $GITHUB_REF)"; exit 1
          fi
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          case "$VERSION" in
            *.dev*|*-dev) ;;
            *) echo "version '$VERSION' is not a dev version (expected X.Y.Z.devN) — open the dev cycle first"; exit 1 ;;
          esac
          echo "dev version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  testpypi:
    needs: gate
    runs-on: ubuntu-latest
    environment: testpypi   # matches the trusted-publisher config on TestPyPI
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
