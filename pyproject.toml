[project]
name = "cogrind-workshop"
version = "0.1.0"
description = "Human-facing MCP client (CLI) for a running cobalt-grinding MCP server. Equivalent in role to Claude Desktop / Claude Code — one MCP client among many."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Gary Frattarola", email = "garyf@parkviewlab.ai" }]
dependencies = [
    "mcp[cli]>=1.27.0",
    "click>=8.1",
    "rich>=13.7",
    "httpx",
    "prompt-toolkit>=3.0",
]

[project.scripts]
cogrind-workshop = "cogrind_workshop.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.5",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cogrind_workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that exercise a running cobalt-grinding server end-to-end",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ty.src]
include = ["src"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# We can tighten these as the codebase matures.
unresolved-import = "warn"
